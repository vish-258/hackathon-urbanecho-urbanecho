; PlatformIO build of the UrbanEchoPCM sketch. Open THIS folder in VS Code.
; The sketch needs Arduino-ESP32 3.x (ESP_I2S); PlatformIO's official espressif32
; platform ships 2.x, so pin the pioarduino release that ships Arduino-ESP32 3.3.8.
; Settings come from UrbanEchoPCM/privateconfig.h (git-ignored), as in Arduino IDE.

[platformio]
src_dir = UrbanEchoPCM
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
