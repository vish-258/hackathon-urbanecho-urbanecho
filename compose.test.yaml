# Layer over compose.yaml. Test scripts supply unique project names and secrets.
# !reset requires Docker Compose >= 2.24.4.
services:
  api:
    ports: !reset []
  tests:
    image: noise-monitor:local
    build: .
    init: true
    command: ["python", "-m", "pytest", "-q"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-noise_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noise_migrate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:-noise_app}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
